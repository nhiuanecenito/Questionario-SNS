services:
  - type: web
    name: questionario-sns
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/responses.db
    disk:
      name: questionario-data
      mountPath: /var/data
      sizeGB: 1
